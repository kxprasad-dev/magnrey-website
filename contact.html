<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnrey — Contact</title>
  <meta name="description" content="Book a call with Magnrey, or reach out by email, office address, or social links.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact" class="placeholder-page">
  <div id="site-header"></div>

  <main>
    <section>
      <div class="container">
        <span class="status">Scaffold — tracked in <a href="https://github.com/kxprasad-dev/magnrey-website/issues/6">#6</a></span>
        <h1>Contact</h1>
        <p>This page is scaffolded and ready to be built out. It should cover:</p>
        <ul class="requirements">
          <li>Direct booking form</li>
          <li>Clear email</li>
          <li>Office address</li>
          <li>Social links</li>
        </ul>

        <h2 style="margin-top: 2rem;">Booking form (placeholder)</h2>
        <form>
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
          </div>
          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="How can we help?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" disabled>Send (not yet wired up)</button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js" defer></script>
</body>
</html>
