<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnrey — Contact</title>
  <meta name="description" content="Book a call with Magnrey, or reach out by email, office address, or social links.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="section">
      <div class="container">
        <p class="eyebrow">Scaffold — tracked in <a href="https://github.com/kxprasad-dev/magnrey-website/issues/6">#6</a></p>
        <h1>Contact</h1>
        <p class="lede">This page is scaffolded and ready to be built out. It should cover:</p>
        <div class="card">
          <div class="card__accent"></div>
          <ul>
            <li>Direct booking form</li>
            <li>Clear email</li>
            <li>Office address</li>
            <li>Social links</li>
          </ul>
        </div>

        <h2 style="margin-top: 2.5rem;">Booking form (placeholder)</h2>
        <form class="card">
          <div class="card__accent"></div>
          <p>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" placeholder="Your name">
          </p>
          <p>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" placeholder="you@example.com">
          </p>
          <p>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="4" placeholder="How can we help?"></textarea>
          </p>
          <button type="submit" class="btn btn--primary" disabled>Send (not yet wired up)</button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js" defer></script>
</body>
</html>
